<title>Немецкий: тренажёр</title>
<style>
:root{--bg:#f4f6f8;--fg:#1b2a3a;--mut:#5b6b7b;--card:#fff;--line:#d6dde4;--ok:#0f766e;--bad:#b42318;--hi:#9a6700;color-scheme:light}
@media(prefers-color-scheme:dark){:root{--bg:#121a22;--fg:#e8eef3;--mut:#9aabba;--card:#1b2630;--line:#2c3a47;--ok:#4fd1a5;--bad:#ff8a7a;--hi:#f0b429;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 "Avenir Next","Segoe UI",system-ui,sans-serif;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
main{max-width:560px;margin:0 auto;padding:16px}
h1{font:600 1.5rem Charter,Georgia,serif;margin:8px 0 2px}
.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.sent{font:1.45rem/1.4 Charter,Georgia,serif;margin:18px 0 6px;overflow-wrap:anywhere}
.vocab{color:var(--mut);font-size:.9rem;margin-bottom:16px}
.opts,.menu{display:grid;gap:10px}
.menu{margin:16px 0}
button{font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:13px 10px;cursor:pointer}
button:focus-visible{outline:3px solid var(--hi);outline-offset:2px}
button.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 18%,var(--card))}
button.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 16%,var(--card))}
.fb{margin-top:16px;padding:10px 14px;border-left:4px solid var(--line);white-space:pre-line}
.fb.ok{border-color:var(--ok)}.fb.bad{border-color:var(--bad)}
.go{background:var(--fg);color:var(--bg);margin-top:14px;width:100%}
.hint{color:var(--hi);margin-top:10px;min-height:1.5em}
small{color:var(--mut)}
.ctx{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:12px 0;line-height:1.75;font-size:.95rem}
.ctx u{text-decoration:none;font-weight:600}.ctx .ok{color:var(--ok)}.ctx .bad{color:var(--bad)}
</style>
</head>

 const ks=[];for(const t of["weak","mixed","strong"])for(const c of C)for(const g of G)if(!(t=="strong"&&c=="Gen"&&(g=="m"||g=="n")))ks.push(`adj|${t}|${c}|${g}`);

 const S=x=>cap(f.replace("{np}",[art,x,ns].filter(Boolean).join(" ")).replace("{v}",v));

function mkPrep(){

 else{fr=c=="Gen"?"Das passiert {p} {np}.":"Ich mache das {p} {np}.";hint=`${p} + ${c}`;rule=`${p} всегда + ${c}`}
 const g=pick(G),gi=G.indexOf(g),n=noun(g),ns=nf(n,c,g),art=DEF[c][gi];

 const m=pick(w.p=="n"?["d","r","g"]:["d","r"]),same=W.filter(x=>x.p==w.p&&x.de!=w.de);

 let prompt,opts,ci,cols=1,hint;
 if(m=="d"){opts=mk(w.ru,x=>x.ru);ci=opts.indexOf(w.ru);prompt=`Что значит ${w.de}?`;hint=w.p=="n"?"существительное":w.p=="v"?"глагол":"прилагательное"}

 const t=lp.t,i0=lp.i,[s,tr,e]=t.q[i0];
 const after=ok=>{lp.i=i0+1;if(ok)lp.n++;if(lp.i==t.q.length)ex.exp+=`\n\nТекст завершён: ${lp.n} из ${t.q.length}`};
 return{key:"b2|lesen",kind:"g",ctx:()=>t.x,prompt:s,vocab:`Aussage ${i0+1} von ${t.q.length}`,opts:["Richtig","Falsch"],ci:tr?0:1,cols:2,ans:tr?"Richtig":"Falsch",exp:e,hint:"Найди в тексте место, где об этом говорится",after};
}
function mkWrite(){
 if(Math.random()<.5){const[s,o,e]=pick(WG),op=o.split(","),opts=shuf(op);return{key:"b2|schreiben",kind:"g",prompt:s,vocab:"",opts,ci:opts.indexOf(op[0]),cols:1,ans:s.replace("___",op[0]),exp:e,hint:"Формальное письмо: вежливо и по шаблону"}}
 const[s,f]=pick(WF);return{key:"b2|schreiben",kind:"g",prompt:s,vocab:"Какую функцию выполняет фраза в письме?",opts:FO,ci:FO.indexOf(f),cols:2,ans:`${s} → ${f}`,exp:"",hint:"Это начало письма, жалоба, просьба или конец?"};
}
const btn=f=>Object.entries(M).filter(([k])=>"slw".includes(k)==!!f).map(([k,v])=>`<button data-m="${k}">${v[0]}</button>`).join("");
const M={v:["Слова B1–B2",mkVocab],a:["Прилагательные",mkAdj],r:["Артикли",mkArt],p:["Предлоги",mkPrep],x:["Микс грамматики",()=>pick([mkAdj,mkArt,mkPrep])()],s:["Sprachbausteine (a/b/c)",mkSprach],l:["Lesen: richtig / falsch",mkLesen],w:["Schreiben: формулы для e-mail",mkWrite]};
const app=document.getElementById("app");
let mode,ex,answered=null,hintOn=false;
const pk=k=>{const p=k.split("|");if(p[0]=="b2")return"B2: "+({sprach:"Sprachbausteine",lesen:"Lesen",schreiben:"Schreiben"})[p[1]];return p[0]=="adj"?`Прилагательные: ${p[2]} · ${p[3]} · ${TR[p[1]]}`:p[0]=="art"?`Артикли: ${p[1]} · ${p[2]}`:`Предлог: ${p[1]}`};

function menu(){
 const now=Date.now(),pv=Object.values(prog),known=pv.filter(p=>p[0]>=4).length,due=pv.filter(p=>p[1]<=now).length;
 let o=0,b=0;for(const k in st){o+=st[k][0];b+=st[k][1]}
 const weak=Object.entries(st).filter(([k,v])=>v[0]+v[1]>=3&&v[1]>0).sort((x,y)=>y[1][1]/(y[1][0]+y[1][1])-x[1][1]/(x[1][0]+x[1][1])).slice(0,3);
 app.innerHTML=`<h1>Немецкий</h1><small>Слова и грамматика. Прогресс хранится в браузере этого устройства.</small>
 <div class="menu">${btn(0)}</div><p><small>B2 Prüfung (telc)</small></p><div class="menu" style="margin-top:0">${btn(1)}</div>
 <p>Слова: начато ${pv.length} из ${W.length}, выучено ${known}, пора повторить ${due}.<br>
 Грамматика: ${o+b?`${o+b} ответов, верно ${Math.round(100*o/(o+b))}%.`:"пока нет ответов."}</p>
 ${weak.length?`<p>Слабые места:<br>${weak.map(([k,v])=>`• ${pk(k)}: ошибок ${Math.round(100*v[1]/(v[0]+v[1]))}%`).join("<br>")}</p>`:""}`;
}
function show(){
 const d=answered!=null,ok=answered==ex.ci;
 app.innerHTML=`<div class="bar"><button data-a="menu">← Меню</button><small>${M[mode][0]}</small></div>
 ${ex.ctx?`<div class="ctx">${ex.ctx()}</div>`:""}<div class="sent">${ex.prompt}</div><div class="vocab">${ex.vocab}</div>
 <div class="opts" style="grid-template-columns:repeat(${ex.cols},1fr)">${ex.opts.map((o,i)=>`<button data-i="${i}" class="${d?(i==ex.ci?"ok":i==answered?"bad":""):""}" ${d?"disabled":""}>${o}</button>`).join("")}</div>
 ${d?`<div class="fb ${ok?"ok":"bad"}"><b>${ok?"Верно!":"Нет. Правильно: "+ex.opts[ex.ci]}</b>\n${ex.ans}${ex.exp?"\n\n"+ex.exp:""}</div><button class="go" data-a="next">Дальше</button>`
 :`<button data-a="hint" style="margin-top:12px">Подсказка</button><div class="hint">${hintOn?ex.hint:""}</div>`}`;
}
function next(){ex=M[mode][1]();answered=null;hintOn=false;show()}
app.onclick=e=>{
 const b=e.target.closest("button");if(!b)return;const d=b.dataset;
 if(d.m){mode=d.m;next()}
 else if(d.a=="menu")menu();
 else if(d.a=="next")next();
 else if(d.a=="hint"){hintOn=true;show()}
 else if(d.i!=null&&answered==null){
  answered=+d.i;const ok=answered==ex.ci;
  if(ex.kind=="v"){const bx=(prog[ex.key]||[0])[0],nb=ok?Math.min(bx+1,5):0;prog[ex.key]=[nb,Date.now()+INT[nb]];save("pr",prog)}
  else{const s=st[ex.key]||[0,0];s[ok?0:1]++;st[ex.key]=s;save("st",st)}
  if(ex.after)ex.after(ok);show()}
};
menu();
</script>
</body>
</html>
